name: QuickAsk
options:
  bundleIdPrefix: com.quickask
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  QuickAsk:
    type: application
    platform: macOS
    sources:
      - path: QuickAsk
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quickask.app
        PRODUCT_NAME: QuickAsk
        INFOPLIST_FILE: QuickAsk/Info.plist
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: true
        CODE_SIGNING_REQUIRED: false
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: QuickAsk/Info.plist
      properties:
        LSUIElement: true
        NSHighResolutionCapable: true
